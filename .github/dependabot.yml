version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Upgrade Vite majors together with a compatible VitePress release.
    ignore:
      - dependency-name: vite
        update-types: ['version-update:semver-major']
    groups:
      documentation:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
