name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os, sys; sys.path.insert(0, "scripts"); from package_release import validate_tag; validate_tag(os.environ["RELEASE_TAG"])'
      - name: Test
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race ./...
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Package binaries
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package_release.py --tag "$RELEASE_TAG"
      - name: Smoke test packaged Linux binary
        run: |
          mkdir -p "$RUNNER_TEMP/kongweave-smoke"
          tar -xzf dist/release/kongweave_linux_amd64.tar.gz -C "$RUNNER_TEMP/kongweave-smoke"
          test "$("$RUNNER_TEMP/kongweave-smoke/kongweave" version)" = "kongweave $GITHUB_REF_NAME"
          for format in deck kongctl; do
            for environment in dev prod; do
              "$RUNNER_TEMP/kongweave-smoke/kongweave" build "$RUNNER_TEMP/kongweave-smoke/examples/$format/overlays/$environment" --output "$RUNNER_TEMP/kongweave-smoke/$format-$environment"
            done
          done
      - name: Save release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/publish-release.sh
            scripts/package_release.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish-release.sh dist/release
